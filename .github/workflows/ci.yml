name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Lets a maintainer re-run the checks without an empty commit — useful after
  # a runner/spending failure, where the red X describes the account and not
  # the code.
  workflow_dispatch:

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: i18n lint
        run: npm run lint:i18n

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # The Rust core is platform-independent and its tests need no device, so they
  # belong in CI. The Android UI itself is not built here: that needs the NDK and
  # a cross-compiled .so, and the mobile work is verified on real hardware.
  rust-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mobile/core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mobile/core/**/Cargo.toml') }}

      - name: Unit tests
        run: cargo test --workspace
        working-directory: mobile/core

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: mobile/core

  # Build a distributable Windows installer on every push to main and auto-publish
  # a GitHub Release when a version tag (v*) is pushed. The app is not code-signed,
  # so SmartScreen may warn — that's expected.
  release:
    if: github.event_name == 'push'
    runs-on: windows-latest
    needs: test-build
    # softprops/action-gh-release creates the Release with GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        # --publish never: electron-builder would otherwise publish on its own for
        # a tag build (and 403 without a write token); the step below does that.
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        # Archive only: a full Actions artifact quota must not block the Release.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: x-ssh-installer
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.blockmap
          fail_on_unmatched_files: false
          skip_if_release_exists: true
