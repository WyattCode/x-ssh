[package]
name = "xssh-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alacritty_terminal = "0.26"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
# 生成密钥对用的随机数源(russh 依赖里本来就有 rand 0.10)。
rand = "0.10"
# SFTP 客户端(跑在 russh 通道的字节流上,和 russh 的版本无关)。
russh-sftp = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
