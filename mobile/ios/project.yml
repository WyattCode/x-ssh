name: XSSH
options:
  bundleIdPrefix: com.wyatt
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.18"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  XSSH:
    type: application
    platform: iOS
    info:
      path: XSSH/Info.plist
      properties:
        # 只有深色界面:不跟随系统的浅色模式。
        UIUserInterfaceStyle: Dark
        # 系统启动画面:纯黑底 + 居中的 logo(120pt)。开屏页(SplashView)接着画同样的 logo,所以交接时看不出换了一层。
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
    scheme:
      testTargets: [XSSHTests]
    sources:
      - XSSH
      - path: Core/generated/xssh_ffi.swift
    dependencies:
      - framework: Core/XSSHCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyatt.xssh
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: X-SSH
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "X-SSH connects to servers on your local network."
  XSSHTests:
    type: bundle.unit-test
    platform: iOS
    sources: [XSSHTests]
    dependencies:
      - target: XSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyatt.xssh.tests
        GENERATE_INFOPLIST_FILE: YES
